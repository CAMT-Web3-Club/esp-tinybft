name: Push component to ESP Component Registry

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  validate_component:
    name: Validate component archive
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Validate component archive (dry run)
        uses: espressif/upload-components-ci-action@v2
        with:
          components: "esp_tinybft: ."
          namespace: "CAMT-Web3-Club"
          api_token: ${{ secrets.IDF_COMPONENT_API_TOKEN }}
          dry_run: true

  upload_component:
    name: Upload component to registry
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Upload component to the component registry
        uses: espressif/upload-components-ci-action@v2
        with:
          components: "esp_tinybft: ."
          namespace: "CAMT-Web3-Club"
          api_token: ${{ secrets.IDF_COMPONENT_API_TOKEN }}
          skip_pre_release: true
